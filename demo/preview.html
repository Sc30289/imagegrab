<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片预览 · 图提取 ImageGrab（本地演示）</title>
  <!-- 复用扩展自带的样式，演示页与真实预览页保持一致 -->
  <link rel="stylesheet" href="../gallery.css" />
  <link rel="icon" href="../icons/icon48.png" />
</head>
<body>
  <!--
    说明：本页面是 gallery.html 的「本地演示版」。
    CRX 里 gallery.html 只能用扩展环境打开（需要 chrome.* API），
    这里额外引入 harness.js 提供的最小 API 替身，其余 DOM 结构与 gallery.html 完全一致。
  -->
  <header class="gp-header">
    <div class="gp-brand">
      <img class="gp-brand__logo" src="../icons/icon48.png" alt="图提取" />
      <div class="gp-brand__text">
        <h1>图提取 <span>ImageGrab</span></h1>
        <p id="pageMeta">正在读取页面信息…</p>
      </div>
    </div>
    <a class="gp-header__link" href="../docs/index.html">产品官网</a>
  </header>

  <div class="gp-toolbar" id="toolbar">
    <div class="gp-toolbar__left">
      <button type="button" class="gp-btn" id="selectAll">全选</button>
      <button type="button" class="gp-btn" id="invertAll">反选</button>
      <span class="gp-counter">已选 <b id="selectedCount">0</b> / 共 <b id="totalCount">0</b> 张</span>
    </div>
    <button type="button" class="gp-btn gp-btn--primary" id="downloadBtn" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3.8v9.6m0 0 3.8-3.8M12 13.4 8.2 9.6" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M5 16.2v1.4A2.4 2.4 0 0 0 7.4 20h9.2a2.4 2.4 0 0 0 2.4-2.4v-1.4"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      下载选中
    </button>
  </div>

  <div class="gp-progress" id="progress" hidden>
    <div class="gp-progress__bar"><i id="progressBar"></i></div>
    <span class="gp-progress__text" id="progressText">准备下载…</span>
  </div>

  <main class="gp-main">
    <section class="gp-grid" id="grid" aria-live="polite"></section>

    <div class="gp-empty" id="empty" hidden>
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect x="12" y="20" width="72" height="56" rx="10" fill="#eef1ff" />
        <circle cx="34" cy="40" r="6" fill="#c7cfff" />
        <path d="M18 66l20-18 14 12 10-8 16 14z" fill="#c7cfff" />
      </svg>
      <h2>还没有提取到图片</h2>
      <p>回到演示商品页，点击右下角的「获取图片」按钮即可开始提取。</p>
    </div>
  </main>

  <div class="gp-toast" id="toast" role="status"></div>

  <!-- 先加载 API 替身，再加载与扩展共用的预览页逻辑 -->
  <script src="harness.js"></script>
  <script src="../gallery.js"></script>
</body>
</html>
